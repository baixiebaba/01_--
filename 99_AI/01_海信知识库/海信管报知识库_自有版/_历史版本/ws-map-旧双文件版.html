*{box-sizing:border-box}

table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line2);vertical-align:top}
th{background:#fafcfc;color:var(--txt2);font-weight:600;font-size:11.5px}
.mono{font-family:var(--mono);font-size:12px}
.muted{color:var(--txt3)}
.chip{display:inline-block;padding:2px 9px;border-radius:10px;font-size:11px;background:var(--brand-l);color:var(--brand-d);

.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}

.ds{border:1px solid var(--line);border-radius:8px;margin-bottom:8px;overflow:hidden;background:#fff}
.ds>.hd2{padding:10px 14px;cursor:pointer;display:flex;gap:10px;align-items:baseline;background:#fafcfc}
.ds>.hd2:hover{background:var(--brand-l2)}
.ds>.hd2 .code{font-family:var(--mono);font-weight:700;color:var(--brand-d)}
.ds>.hd2 .nm{font-weight:600}
.ds>.hd2 .rt{margin-left:auto;font-size:11px;color:var(--txt3);white-space:nowrap}
.ds .body{padding:0 14px 12px;display:none}

.badge{font-size:10.5px;padding:1px 7px;border-radius:9px;border:1px solid var(--line);color:var(--txt2);background:#f1f4f5}
.badge.warn{color:var(--warn);border-color:#f6e0bf;background:#fdf3e5}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}

.gitem .cap{padding:8px 10px;font-size:12px}

.empty{color:var(--txt3);padding:24px;text-align:center}
.hint{background:var(--brand-l2);border:1px dashed #bfe0e0;border-radius:6px;padding:9px 12px;font-size:12px;color:var(--txt2);margin-bottom:12px}

<script>
"use strict";
var CAT = JSON.parse(document.getElementById("wscat").textContent);

/* 本地服务器下用外部 ws_catalog.json 覆盖内嵌兜底 */
if (location.protocol !== "file:") {
  fetch("ws_catalog.json?t=" + Date.now()).then(function(r){return r.json();}).then(function(j){ CAT=j; route(); })
    .catch(function(){});
}
document.getElementById("btnReload").onclick = function(){
  if (location.protocol === "file:") { alert("双击模式下无法读取外部文件，请用本地服务器：\ncd 本目录 && python3 -m http.server 8000"); return; }
  fetch("ws_catalog.json?t=" + Date.now()).then(function(r){return r.json();}).then(function(j){ CAT=j; route(); alert("已重新加载"); }).catch(function(e){alert("失败:"+e);});
};

var wsFilter = "ALL";
var dirQuery = "";
var ovDiv=document.getElementById("view-ov"), archDiv=document.getElementById("view-arch"), dirDiv=document.getElementById("view-dir");

function tab(name){
  document.querySelectorAll(".tab").forEach(function(t){ t.classList.toggle("on", t.dataset.tab===name); });
  ovDiv.style.display = name==="ov"?"block":"none";
  archDiv.style.display = name==="arch"?"block":"none";
  dirDiv.style.display = name==="dir"?"block":"none";
  if(name==="ov") renderOv();
  if(name==="arch") renderArch();
  if(name==="dir") renderDir();
}
document.querySelectorAll(".tab").forEach(function(t){ t.onclick=function(){ tab(t.dataset.tab); }; });

function route(){ var h=(location.hash||"").replace(/^#/,""); if(h==="arch")tab("arch"); else if(h==="dir")tab("dir"); else tab("ov"); }

/* ---------- 总览 ---------- */
function renderOv(){
  var s=CAT.summary, m=CAT.meta;
  var html = '<div class="hint">数据来源：'+m.source+' ｜ 生成于 '+m.generatedAt+' ｜ 状态 '+m.status+'<br>'+m.note+'</div>';
  html += '<div class="cards">';
  html += card("Workspace 数", s.workspaces.length);
  html += card("Dataset 数", s.datasetCount);
  html += card("字段数", s.fieldCount);
  html += card("架构图", s.imageCount);
  html += card("辅助命名表", s.auxCount);
  html += '</div>';
  // workspace 明细
  html += '<div class="panel"><div class="hd">各 Workspace 的 Dataset 分布</div><div class="bd"><table><thead><tr><th>Workspace</th><th>Dataset 数</th><th>字段数</th><th>主题</th></tr></thead><tbody>';
  s.workspaces.forEach(function(w){
    var ds=CAT.datasets.filter(function(d){return d.workspace===w;});
    var fc=ds.reduce(function(a,d){return a+(d.fieldCount||0);},0);
    var themes={}; ds.forEach(function(d){ if(d.theme) themes[d.theme]=(themes[d.theme]||0)+1; });
    var th=Object.keys(themes).join("、")||"—";
    html += '<tr><td class="mono">'+w+'</td><td>'+ds.length+'</td><td>'+fc+'</td><td class="muted">'+th+'</td></tr>';
  });
  html += '</tbody></table></div></div>';
  // 架构图清单
  html += '<div class="panel"><div class="hd">架构图清单（'+CAT.illustrations.length+'）</div><div class="bd"><table><thead><tr><th>编号</th><th>标题</th><th>说明</th><th>类型</th></tr></thead><tbody>';
  CAT.illustrations.forEach(function(it){
    html += '<tr><td class="mono">'+it.id+'</td><td><b>'+it.title+'</b></td><td class="muted">'+esc(it.note||"")+'</td><td class="muted">'+esc(it.kind||"")+'</td></tr>';
  });
  html += '</tbody></table></div></div>';
  // architecture 映射
  html += '<div class="panel"><div class="hd">Workspace → 层 / 角色 映射</div><div class="bd"><table><thead><tr><th>Workspace</th><th>层</th><th>角色</th><th>依据</th></tr></thead><tbody>';
  CAT.architecture.forEach(function(a){ html += '<tr><td class="mono">'+a.workspace+'</td><td>'+esc(a.layer||"")+'</td><td>'+esc(a.role||"")+'</td><td class="muted">'+esc(a.basis||"")+'</td></tr>'; });
  html += '</tbody></table></div></div>';
  ovDiv.innerHTML = html;
}
function card(k,v){ return '<div class="card"><div class="k">'+k+'</div><div class="v">'+v+'</div></div>'; }

/* ---------- 架构图 ---------- */
function renderArch(){
  var html = '<div class="hint">点击缩略图查看大图。共 '+CAT.illustrations.length+' 张，按 总体→收入→成本→…→KPI 排列。</div>';
  html += '<div class="gal">';
  CAT.illustrations.forEach(function(it){
    var id=it.id;
    html += '<div class="gitem" onclick="openImg(\''+id+'\')"><img src="assets/arch/'+id+'.png" loading="lazy" alt="'+esc(it.title)+'"><div class="cap"><b>'+esc(it.title)+'</b><span class="muted">'+esc((it.note||"").slice(0,40))+'…</span></div></div>';
  });
  html += '</div>';
  archDiv.innerHTML = html;
}
function openImg(id){
  var it=CAT.illustrations.find(function(x){return x.id===id;});
  document.getElementById("lbimg").src="assets/arch/"+id+".png";
  document.getElementById("lbcap").innerHTML = "<b>"+esc(it?it.title:"")+"</b><br>"+esc(it?it.note:"");
  document.getElementById("lb").classList.add("on");
}

/* ---------- 数据目录 ---------- */
function renderDir(){
  var html = '<div class="toolbar"><div>';
  html += '<span class="chip '+(wsFilter==="ALL"?"on":"")+'" data-w="ALL">全部</span>';
  CAT.summary.workspaces.forEach(function(w){ html += '<span class="chip '+(wsFilter===w?"on":"")+'" data-w="'+w+'">'+w+'</span>'; });
  html += '</div><input type="text" id="dirQ" placeholder="搜索 Dataset 编码 / 名称 / 主题 / 物理表（如 RDEDML、收入、AW_MR9）" value="'+esc(dirQuery)+'"></div>';
  var ds = CAT.datasets.filter(function(d){ return wsFilter==="ALL"||d.workspace===wsFilter; });
  if(dirQuery){
    var q=dirQuery.toLowerCase();
    ds = ds.filter(function(d){
      return (d.code||"").toLowerCase().indexOf(q)>=0 || (d.name||"").toLowerCase().indexOf(q)>=0 ||
             (d.theme||"").toLowerCase().indexOf(q)>=0 || (d.physicalTables||"").toLowerCase().indexOf(q)>=0;
    });
  }
  html += '<div class="muted" style="margin-bottom:8px">命中 '+ds.length+' 个 Dataset</div>';
  if(!ds.length){ html += '<div class="empty">无匹配</div>'; }
  ds.forEach(function(d){
    html += '<div class="ds" data-id="'+esc(d.id)+'"><div class="hd2" onclick="toggleDs(this)">'+
      '<span class="code">'+esc(d.code)+'</span><span class="nm">'+esc(d.name||"")+'</span>'+
      '<span class="badge">'+esc(d.workspace)+'</span>'+
      (d.theme?'<span class="badge">'+esc(d.theme)+'</span>':'')+
      (d.status&&d.status!=="有效"?'<span class="badge warn">'+esc(d.status)+'</span>':'')+
      '<span class="rt">字段 '+ (d.fieldCount||0) +' · 物理表 '+(d.physicalCount||0)+'</span></div>'+
      '<div class="body" id="ds-'+esc(d.id)+'"></div></div>';
  });
  // 辅助命名表（未纳入）
  if(wsFilter==="ALL" || true){
    html += '<div class="panel" style="margin-top:14px"><div class="hd">辅助命名表（未纳入血缘，仅供参考）· '+CAT.auxiliary.length+'</div><div class="bd"><table><thead><tr><th>Workspace</th><th>物理表</th><th>字段数</th><th>状态</th><th>来源区间</th></tr></thead><tbody>';
    CAT.auxiliary.forEach(function(a){ html += '<tr><td class="mono">'+esc(a.workspace)+'</td><td class="mono">'+esc(a.table)+'</td><td>'+(a.fieldCount||"")+'</td><td class="muted">'+esc(a.status||"")+'</td><td class="mono muted">'+(a.sourceRange||"")+'</td></tr>'; });
    html += '</tbody></table></div></div>';
  }
  dirDiv.innerHTML = html;
  dirDiv.querySelectorAll(".chip").forEach(function(c){ c.onclick=function(){ wsFilter=c.dataset.w; renderDir(); }; });
  var q=document.getElementById("dirQ"); if(q) q.oninput=function(){ dirQuery=q.value; renderDir(); };
}
function toggleDs(el){
  var ds=el.parentNode, id=ds.dataset.id, body=document.getElementById("ds-"+id);
  if(ds.classList.toggle("open")){
    if(!body.dataset.loaded){
      var d=CAT.datasets.find(function(x){return x.id===id;});
      var flds=CAT.fields.filter(function(f){return f.datasetId===id;});
      var html='<div class="muted" style="margin:4px 0 8px">物理表：<span class="mono">'+esc(d.physicalTables||"")+'</span> ｜ 来源：<span class="mono">'+(d.sourceRange||"")+'</span></div>';
      html+='<table><thead><tr><th>#</th><th>字段</th><th>类型</th><th>长度</th><th>可空</th><th>物理表</th><th>注释</th></tr></thead><tbody>';
      flds.forEach(function(f){ html+='<tr><td class="muted">'+(f.position||"")+'</td><td class="mono">'+esc(f.name)+'</td><td>'+esc(f.type||"")+'</td><td>'+(f.length||"")+'</td><td>'+(f.nullable||"")+'</td><td class="mono muted">'+esc(f.table||"")+'</td><td class="muted">'+esc(f.comment||"")+'</td></tr>'; });
      html+='</tbody></table>';
      body.innerHTML=html; body.dataset.loaded="1";
    }
  }
}
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }

route();
</script>
